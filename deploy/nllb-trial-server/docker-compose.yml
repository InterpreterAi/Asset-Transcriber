# NLLB MT worker — LibreTranslate-compatible POST /translate on :5000 (host maps e.g. :5002 or :5010).
#
# Trial: replace libre-trial on :5002 — set TRIAL_HETZNER_NLLB_BASE on API.
# Paid Arabic: run a second instance (e.g. host :5010) — set NLLB_PAID_BASE on API.
#
# RAM: ~3.5–4.5 GB for int8 NLLB-1.3B + OS headroom. Add swap on small hosts (see INSTALL.md).
version: "3.8"

services:
  nllb-mt:
    build: .
    container_name: nllb-mt
    ports:
      - "5002:5000"
    restart: unless-stopped
    mem_limit: 4500m
    environment:
      NLLB_MODEL_ID: "facebook/nllb-200-distilled-1.3B"
      NLLB_MAX_INPUT_CHARS: "512"
      NLLB_MAX_NEW_TOKENS: "256"
      NLLB_NUM_BEAMS: "1"
